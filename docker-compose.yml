services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - project-finder-mongo:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/project-finder
      JWT_SECRET: local-development-secret-change-this-to-at-least-32-characters
      FRONTEND_ORIGINS: http://localhost:3000,http://localhost:5173
      REDIS_URL: redis://redis:6379

volumes:
  project-finder-mongo:
