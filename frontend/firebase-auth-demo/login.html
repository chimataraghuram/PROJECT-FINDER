<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Firebase Auth</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8 font-serif">Welcome Back</h2>
        
        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
                    placeholder="email@example.com">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
                    placeholder="Enter password">
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-lg active:scale-95 duration-100">
                Log In
            </button>
        </form>

        <div class="mt-6 flex items-center justify-center gap-4">
            <div class="h-px bg-gray-300 flex-1"></div>
            <span class="text-xs text-gray-500 uppercase">Or</span>
            <div class="h-px bg-gray-300 flex-1"></div>
        </div>

        <button id="google-login"
            class="mt-6 w-full bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 transition-all">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5 h-5">
            Continue with Google
        </button>

        <div class="mt-8 text-center text-sm text-gray-600">
            Don't have an account? 
            <a href="signup.html" class="text-blue-600 font-bold hover:underline">Sign up now</a>
        </div>
    </div>

    <script type="module">
        import { login, loginWithGoogle } from './auth.js';

        const form = document.querySelector('#login-form');
        const googleBtn = document.querySelector('#google-login');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.querySelector('#email').value;
            const password = document.querySelector('#password').value;

            const { user, error } = await login(email, password);
            
            if (error) {
                alert("Login failed: " + error);
            } else {
                alert("Login successful!");
                window.location.href = 'dashboard.html';
            }
        });

        googleBtn.addEventListener('click', async () => {
            const { user, error } = await loginWithGoogle();
            if (error) {
                alert("Google Login failed: " + error);
            } else {
                alert("Login successful!");
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
