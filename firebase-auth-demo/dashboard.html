<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Firebase Auth</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-gray-800">My Dashboard</h1>
        <button id="logout-btn" class="bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 px-4 py-2 rounded-lg font-semibold transition-all">
            Logout
        </button>
    </nav>

    <main class="max-w-4xl mx-auto mt-12 px-6">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex items-center gap-6 mb-8">
                <div id="user-avatar" class="w-20 h-20 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-3xl font-bold">
                    ?
                </div>
                <div>
                    <h2 class="text-2xl font-bold text-gray-800" id="user-display-name">Loading...</h2>
                    <p class="text-gray-500" id="user-email">...</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="p-6 bg-blue-50 rounded-xl border border-blue-100">
                    <p class="text-blue-600 font-bold text-sm uppercase mb-1">Status</p>
                    <p class="text-blue-900 font-bold text-lg">Active Session</p>
                </div>
                <div class="p-6 bg-green-50 rounded-xl border border-green-100">
                    <p class="text-green-600 font-bold text-sm uppercase mb-1">Verified</p>
                    <p class="text-green-900 font-bold text-lg">Verified Account</p>
                </div>
                <div class="p-6 bg-orange-50 rounded-xl border border-orange-100">
                    <p class="text-orange-600 font-bold text-sm uppercase mb-1">Account</p>
                    <p class="text-orange-900 font-bold text-lg">Personal User</p>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { checkAuthState, logout } from './auth.js';

        // Protected Route Logic
        checkAuthState((user) => {
            if (!user) {
                // If not logged in, redirect to login page
                window.location.href = 'login.html';
            } else {
                // Populate user info
                document.getElementById('user-email').textContent = user.email;
                document.getElementById('user-display-name').textContent = user.displayName || 'Authentic User';
                document.getElementById('user-avatar').textContent = (user.displayName || user.email).charAt(0).toUpperCase();
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await logout();
        });
    </script>
</body>
</html>
